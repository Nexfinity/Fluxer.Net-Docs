        <h1>Creating Your First Bot</h1>

        <p>Welcome to Fluxer.Net! This guide will walk you through creating your first bot using the Fluxer.Net library.</p>

        <h2>Prerequisites</h2>
        <ul>
            <li>.NET 7.0 SDK or later</li>
            <li>A Fluxer account</li>
            <li>Basic knowledge of C# and async/await programming</li>
        </ul>

        <h2>Installation</h2>
        <p>First, create a new console application and install the Fluxer.Net package:</p>

        <pre><code class="language-sh">dotnet new console -n MyFluxerBot
cd MyFluxerBot
dotnet add package Fluxer.Net</code></pre>

        <h2>Getting Your Token</h2>
        <p>To connect your bot to Fluxer, you'll need an authentication token. There are two types of tokens you can use:</p>

        <h3>Bot Token (Application Bots)</h3>
        <p>Bot tokens are the proper way to create and manage a bot. To obtain a user token:</p>
        <ol>
            <li>Log into your Fluxer account through the web or desktop client</li>
            <li>Open your user Settings.</li>
            <li>Navigate to Developer > Applications</li>
            <li>Follow the steps to create a bot application</li>
            <li>Find the <code>token</code> key and copy its value</li>
        </ol>

        <h3>User Token (User Bots)</h3>
        <p>User tokens allow your bot to act as a regular user account. To obtain a user token:</p>
        <ol>
            <li>Log into your Fluxer account through the web or desktop client</li>
            <li>Open the developer console (F12 in most browsers)</li>
            <li>Navigate to Application > Local Storage > https://fluxer.app</li>
            <li>Find the <code>token</code> key and copy its value</li>
        </ol>

        <div style="background-color: #3ca1fa; color: white; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 6px solid #0c477a;">
            <h2 style="margin-top: 0; color: white;">Token Prefixes Notice</h2>
            <p style="margin-bottom: 0;"><strong>User and bot tokens require different prefixes:</strong></p>
            <ul style="margin-bottom: 0;">
                <li>User Tokens: User tokens will automatically be prefixed with `flx_`</li>
                <li>Bot Tokens: You will need to add a `Bot ` prefix (including the space) before the token,</strong></li>
            </ul>
        </div>

        <p><strong>Warning:</strong> Never share your token with anyone. Anyone with your token can access your account.</p>

        <h2>Setting Up Your Bot</h2>
        <p>Now let's write the code to connect to Fluxer. Open <code>Program.cs</code> and replace its contents with:</p>

        <pre><code class="language-cs">using Fluxer.Net;
using Serilog;

// Configure logging
Log.Logger = new LoggerConfiguration()
    .MinimumLevel.Information()
    .WriteTo.Console()
    .CreateLogger();

// Your Fluxer token
const string token = "YOUR_TOKEN_HERE";

// Create configuration
var config = new FluxerConfig
{
    Serilog = Log.Logger,
    EnableRateLimiting = true
};

// Create the clients
var apiClient = new ApiClient(token, config);
var gatewayClient = new GatewayClient(token, config);

// Connect to the gateway
await gatewayClient.ConnectAsync();

Log.Information("Bot is running! Press Ctrl+C to exit.");

// Keep the application running
await Task.Delay(-1);</code></pre>

        <h2>Understanding the Code</h2>
        <ul>
            <li><strong>FluxerConfig:</strong> Configuration object that controls the behavior of both the API and Gateway clients</li>
            <li><strong>ApiClient:</strong> Used for making REST API requests to Fluxer (sending messages, managing guilds, etc.)</li>
            <li><strong>GatewayClient:</strong> Maintains a WebSocket connection for real-time events (messages, user updates, etc.)</li>
        </ul>

        <h2>Running Your Bot</h2>
        <p>Replace <code>YOUR_TOKEN_HERE</code> with your actual token, then run:</p>

        <pre><code class="language-sh">dotnet run</code></pre>

        <p>You should see log messages indicating that your bot has successfully connected to Fluxer!</p>

        <h2>Next Steps</h2>
        <p>Your bot is now connected, but it doesn't do anything yet. In the next tutorial, we'll learn how to receive and respond to messages.</p>
