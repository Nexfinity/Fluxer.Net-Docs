        <h1>Your First Command</h1>

        <p>In this tutorial, we'll create a command bot using Fluxer.Net's powerful <code>CommandService</code> framework. This framework provides automatic argument parsing, type conversion, and a clean module-based structure for organizing your commands.</p>

        <h2>What is the CommandService?</h2>
        <p>The <code>CommandService</code> is a framework that makes building command bots easy by handling:</p>
        <ul>
            <li><strong>Automatic command discovery:</strong> Commands are defined using attributes</li>
            <li><strong>Argument parsing:</strong> Automatically converts string arguments to the correct types</li>
            <li><strong>Command organization:</strong> Commands are grouped into modules for better structure</li>
            <li><strong>Error handling:</strong> Built-in validation and error messages</li>
        </ul>

        <h2>Setting Up the CommandService</h2>
        <p>First, let's set up the basic bot with the CommandService:</p>

        <pre><code class="language-cs">using System.Reflection;
using Fluxer.Net;
using Fluxer.Net.Commands;
using Fluxer.Net.Data.Models;
using Serilog;

Log.Logger = new LoggerConfiguration()
    .MinimumLevel.Information()
    .WriteTo.Console()
    .CreateLogger();

const string token = "YOUR_TOKEN_HERE";

var config = new FluxerConfig
{
    Serilog = Log.Logger
};

var apiClient = new ApiClient(token, config);
var gatewayClient = new GatewayClient(token, config);

// Create the CommandService with '/' as the prefix
var commands = new CommandService(
    prefixChar: '/',
    logger: Log.Logger,
    services: null
);

// Register all command modules from your assembly
await commands.AddModulesAsync(Assembly.GetExecutingAssembly());

gatewayClient.Ready += (data) =>
{
    Log.Information("Bot ready! Logged in as {Username}", data.User.Username);
};

// Handle incoming messages and execute commands
gatewayClient.MessageCreate += async (data) =>
{
    // Ignore messages without an author (system messages, webhooks) and other bots to prevent spam loops
    if (data.Author == null || data.Author.IsBot)
        return;

    // Check if message starts with the prefix
    int argPos = 0;
    if (data.Content?.StartsWith('/') == true)
    {
        argPos = 1; // Skip the prefix character

        // Create a command context
        var context = new CommandContext(apiClient, gatewayClient, data);

        // Execute the command
        var result = await commands.ExecuteAsync(context, argPos);

        // Handle errors
        if (!result.IsSuccess)
        {
            Log.Warning("Command failed: {Error}", result.Error);

            // Optionally send error message to user
            if (result.ErrorType == CommandError.BadArgCount ||
                result.ErrorType == CommandError.ParseFailed)
            {
                await apiClient.SendMessage(data.ChannelId, new()
                {
                    Content = $"❌ Error: {result.Error}"
                });
            }
        }
    }
};

await gatewayClient.ConnectAsync();
await Task.Delay(-1);</code></pre>

        <h2>Creating Your First Command Module</h2>
        <p>Commands are organized into modules. Create a new file called <code>BasicCommands.cs</code>:</p>

        <pre><code class="language-cs">using Fluxer.Net.Commands;
using Fluxer.Net.Commands.Attributes;

namespace MyBot.Modules;

public class BasicCommands : ModuleBase
{
    [Command("ping")]
    [Summary("Check if the bot is responsive")]
    public async Task PingCommand()
    {
        await ReplyAsync("Pong!");
    }

    [Command("hello")]
    [Alias("hi", "hey")]
    [Summary("Get a friendly greeting")]
    public async Task HelloCommand()
    {
        await ReplyAsync($"Hello, <@{Context.User.Id}>!");
    }

    [Command("info")]
    [Summary("Show bot information")]
    public async Task InfoCommand()
    {
        await ReplyAsync(
            "**My Bot**\n" +
            "Built with Fluxer.Net\n\n" +
            "Available Commands:\n" +
            "• `/ping` - Check if bot is responsive\n" +
            "• `/hello` - Get a greeting\n" +
            "• `/info` - Show this information"
        );
    }
}</code></pre>

        <h2>Understanding Command Modules</h2>

        <h3>ModuleBase</h3>
        <p>All command modules must inherit from <code>ModuleBase</code>, which provides:</p>
        <ul>
            <li><code>Context</code> - Access to the message, user, channel, and API clients</li>
            <li><code>ReplyAsync()</code> - Helper method to send a message to the current channel</li>
        </ul>

        <h3>Command Attributes</h3>
        <ul>
            <li><code>[Command("name")]</code> - Defines a command with the given name</li>
            <li><code>[Alias("alt1", "alt2")]</code> - Alternative names for the command</li>
            <li><code>[Summary("description")]</code> - Description of what the command does</li>
        </ul>

        <h2>Commands with Parameters</h2>
        <p>The CommandService automatically parses and converts command arguments:</p>

        <pre><code class="language-cs">public class MathCommands : ModuleBase
{
    [Command("add")]
    [Summary("Add two numbers together")]
    public async Task AddCommand(int a, int b)
    {
        await ReplyAsync($"{a} + {b} = {a + b}");
    }

    [Command("echo")]
    [Summary("Echo back your message")]
    public async Task EchoCommand([Remainder] string message)
    {
        await ReplyAsync(message);
    }

    [Command("greet")]
    [Summary("Greet someone by name")]
    public async Task GreetCommand(string name = "stranger")
    {
        await ReplyAsync($"Hello, {name}!");
    }
}</code></pre>

        <h3>Parameter Types</h3>
        <p>The CommandService supports automatic conversion for many types:</p>
        <ul>
            <li><code>string</code>, <code>int</code>, <code>long</code>, <code>ulong</code>, <code>bool</code></li>
            <li><code>float</code>, <code>double</code>, <code>decimal</code></li>
            <li><code>DateTime</code>, <code>TimeSpan</code></li>
            <li>Enums</li>
        </ul>

        <h3>Special Attributes</h3>
        <ul>
            <li><code>[Remainder]</code> - Captures all remaining text as one parameter (useful for messages)</li>
            <li>Optional parameters - Use default values like <code>string name = "stranger"</code></li>
        </ul>

        <h2>Advanced Example: User Info Command</h2>
        <p>Here's a more complex command that fetches user information:</p>

        <pre><code class="language-cs">[Command("userinfo")]
[Summary("Get information about a user")]
public async Task UserInfoCommand(ulong? userId = null)
{
    // Use provided user ID or default to command author
    ulong targetId = userId ?? Context.User.Id;

    try
    {
        var user = await Context.Client.GetUser(targetId);

        var info = $@"**User Information**
**Username:** {user.Username}
**ID:** {user.Id}
**Created:** {user.CreatedAt:MMM dd, yyyy}
**Premium:** {(user.Premium > 0 ? "Yes" : "No")}";

        await ReplyAsync(info);
    }
    catch (Exception ex)
    {
        await ReplyAsync("Failed to fetch user information.");
    }
}</code></pre>

        <h2>Using Embeds in Commands</h2>
        <p>For more visually appealing responses, you can use embeds with the <code>EmbedBuilder</code>:</p>

        <pre><code class="language-cs">using Fluxer.Net.Data.Models;
using Fluxer.Net.EmbedBuilder;

[Command("embed")]
[Summary("Show an example rich embed")]
public async Task EmbedCommand()
{
    var embed = new EmbedBuilder()
        .WithTitle("Example Embed")
        .WithDescription("This is a rich embed created with EmbedBuilder!")
        .WithColor(0x5865F2) // Blue color
        .WithAuthor(
            name: Context.User.Username,
            iconUrl: Context.User.Avatar != null
                ? $"https://cdn.fluxer.dev/avatars/{Context.User.Id}/{Context.User.Avatar}.png"
                : null
        )
        .AddField("Field 1", "Inline field", inline: true)
        .AddField("Field 2", "Another inline field", inline: true)
        .AddField("Full Width", "This field is not inline", inline: false)
        .WithFooter("Fluxer.Net")
        .WithCurrentTimestamp()
        .Build();

    await Context.Client.SendMessage(Context.ChannelId, new()
    {
        Content = "Here's an embed:",
        Embeds = new List<Embed> { embed }
    });
}</code></pre>

        <p>See the <a href="/guides/embed-builder.html">EmbedBuilder Guide</a> for more examples and advanced usage.</p>

        <h2>Testing Your Commands</h2>
        <p>Run your bot and try these commands in a channel:</p>
        <ul>
            <li><code>/ping</code> - Should respond with "Pong!"</li>
            <li><code>/hello</code> - Should greet you with a mention</li>
            <li><code>/info</code> - Should show bot information</li>
            <li><code>/add 5 3</code> - Should respond with "5 + 3 = 8"</li>
            <li><code>/echo Hello World</code> - Should respond with "Hello World"</li>
        </ul>

        <h2>Best Practices</h2>

        <h3>1. Organize Commands into Modules</h3>
        <p>Group related commands together in separate module classes:</p>
        <pre><code class="language-cs">// ModerationCommands.cs
public class ModerationCommands : ModuleBase { ... }

// FunCommands.cs
public class FunCommands : ModuleBase { ... }

// UtilityCommands.cs
public class UtilityCommands : ModuleBase { ... }</code></pre>

        <h3>2. Use Descriptive Summaries</h3>
        <p>Always include <code>[Summary]</code> attributes to document your commands:</p>
        <pre><code class="language-cs">[Command("kick")]
[Summary("Remove a member from the server")]
public async Task KickCommand(ulong userId, [Remainder] string reason = "No reason")
{
    // Implementation
}</code></pre>

        <h3>3. Handle Errors Gracefully</h3>
        <p>Always wrap API calls in try-catch blocks within your commands:</p>
        <pre><code class="language-cs">[Command("getuser")]
public async Task GetUserCommand(ulong userId)
{
    try
    {
        var user = await Context.Client.GetUser(userId);
        await ReplyAsync($"Found user: {user.Username}");
    }
    catch (Exception)
    {
        await ReplyAsync("User not found or an error occurred.");
    }
}</code></pre>

        <h2>Advanced Features</h2>
        <p>The CommandService provides additional advanced features for building sophisticated bots:</p>

        <h3>Command Aliases</h3>
        <p>Allow multiple names for the same command:</p>
        <pre><code class="language-cs">[Command("userinfo")]
[Alias("user", "whois", "profile")]
public async Task UserInfoCommand() { ... }</code></pre>

        <h3>Preconditions</h3>
        <p>Add requirements that must be met before a command can execute:</p>
        <pre><code class="language-cs">using Fluxer.Net.Commands.Attributes;

[Command("announce")]
[RequireOwner] // Only bot owner can use this
public async Task AnnounceCommand([Remainder] string message)
{
    await ReplyAsync($"📢 {message}");
}

[Command("ban")]
[RequireContext(ContextType.Guild)] // Only works in guilds, not DMs
public async Task BanCommand(ulong userId)
{
    // Ban logic
}</code></pre>

        <h3>Module Lifecycle Hooks</h3>
        <p>Override methods in your module to run code before/after command execution:</p>
        <pre><code class="language-cs">public class MyCommands : ModuleBase
{
    protected override void BeforeExecute()
    {
        // Runs before every command in this module
        Log.Information("User {User} is running a command", Context.User.Username);
    }

    protected override void AfterExecute()
    {
        // Runs after every command in this module
        Log.Information("Command completed successfully");
    }
}</code></pre>
