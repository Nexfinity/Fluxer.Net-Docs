        <h1>Gateway Events Reference</h1>

        <p>This page provides a comprehensive reference of all gateway events available in Fluxer.Net. Events are fired by the <code>GatewayClient</code> when real-time updates occur.</p>

        <h2>Event Categories</h2>
        <ul>
            <li><a href="#lifecycle">Gateway Lifecycle</a> - Connection and session events</li>
            <li><a href="#messages">Messages</a> - Message creation, editing, and deletion</li>
            <li><a href="#channels">Channels</a> - Channel management events</li>
            <li><a href="#guilds">Guilds</a> - Guild (server) events</li>
            <li><a href="#members">Guild Members</a> - Member join, update, and leave events</li>
            <li><a href="#roles">Guild Roles</a> - Role management events</li>
            <li><a href="#presence">Presence</a> - User online status updates</li>
            <li><a href="#typing">Typing Indicators</a> - User typing events</li>
            <li><a href="#reactions">Reactions</a> - Message reaction events</li>
            <li><a href="#voice">Voice</a> - Voice channel and state events</li>
            <li><a href="#relationships">Relationships</a> - Friend and block events</li>
            <li><a href="#invites">Invites</a> - Invite creation and deletion</li>
            <li><a href="#user-settings">User Settings</a> - User preference updates</li>
        </ul>

        <h2 id="lifecycle">Gateway Lifecycle Events</h2>

        <h3>Ready</h3>
        <p>Fires when the gateway connection is established and initial data is received.</p>
        <pre><code class="language-cs">gatewayClient.Ready += (data) =>
{
    // data.SessionId - Session ID for resuming
    // data.User - Current user information
    // data.Guilds - List of guilds
    // data.PrivateChannels - List of DM channels
    // data.Relationships - List of friends/blocks
};</code></pre>

        <h3>Resumed</h3>
        <p>Fires when a disconnected session is successfully resumed.</p>
        <pre><code class="language-cs">gatewayClient.Resumed += () =>
{
    Console.WriteLine("Session resumed!");
};</code></pre>

        <h3>HeartbeatAck</h3>
        <p>Fires when the gateway acknowledges a heartbeat (connection health check).</p>
        <pre><code class="language-cs">gatewayClient.HeartbeatAck += () =>
{
    // Connection is healthy
};</code></pre>

        <h2 id="messages">Message Events</h2>

        <h3>MessageCreate</h3>
        <p>Fires when a new message is sent in any channel the user has access to.</p>
        <pre><code class="language-cs">gatewayClient.MessageCreate += async (data) =>
{
    // data.Message.Id - Message ID
    // data.Message.ChannelId - Channel where message was sent
    // data.Message.Author - User who sent the message
    // data.Message.Content - Message text content
    // data.Message.Attachments - List of attachments
    // data.Message.Embeds - List of embeds
    // data.Message.Mentions - List of mentioned users
};</code></pre>

        <h3>MessageUpdate</h3>
        <p>Fires when a message is edited.</p>
        <pre><code class="language-cs">gatewayClient.MessageUpdate += (data) =>
{
    // data.Message - Updated message data
    // Note: May be partial data containing only changed fields
};</code></pre>

        <h3>MessageDelete</h3>
        <p>Fires when a message is deleted.</p>
        <pre><code class="language-cs">gatewayClient.MessageDelete += (data) =>
{
    // data.Id - Deleted message ID
    // data.ChannelId - Channel where message was deleted
};</code></pre>

        <h3>MessageDeleteBulk</h3>
        <p>Fires when multiple messages are deleted at once (e.g., purge).</p>
        <pre><code class="language-cs">gatewayClient.MessageDeleteBulk += (data) =>
{
    // data.Ids - List of deleted message IDs
    // data.ChannelId - Channel where messages were deleted
};</code></pre>

        <h3>MessageAck</h3>
        <p>Fires when a message is acknowledged as read by the current user.</p>
        <pre><code class="language-cs">gatewayClient.MessageAck += (data) =>
{
    // data.MessageId - Message that was acknowledged
    // data.ChannelId - Channel of the message
};</code></pre>

        <h2 id="channels">Channel Events</h2>

        <h3>ChannelCreate</h3>
        <p>Fires when a channel is created.</p>
        <pre><code class="language-cs">gatewayClient.ChannelCreate += (data) =>
{
    // data.Channel - The created channel
};</code></pre>

        <h3>ChannelUpdate</h3>
        <p>Fires when a channel is updated (name, topic, permissions, etc.).</p>
        <pre><code class="language-cs">gatewayClient.ChannelUpdate += (data) =>
{
    // data.Channel - Updated channel data
};</code></pre>

        <h3>ChannelDelete</h3>
        <p>Fires when a channel is deleted.</p>
        <pre><code class="language-cs">gatewayClient.ChannelDelete += (data) =>
{
    // data.Channel - Deleted channel data
};</code></pre>

        <h3>ChannelPinsUpdate</h3>
        <p>Fires when a message is pinned or unpinned in a channel.</p>
        <pre><code class="language-cs">gatewayClient.ChannelPinsUpdate += (data) =>
{
    // data.ChannelId - Channel where pins changed
    // data.LastPinTimestamp - When the last pin occurred
};</code></pre>

        <h3>ChannelRecipientAdd / ChannelRecipientRemove</h3>
        <p>Fires when a user is added to or removed from a group DM.</p>
        <pre><code class="language-cs">gatewayClient.ChannelRecipientAdd += (data) =>
{
    // data.ChannelId - Group DM channel
    // data.User - User who was added
};

gatewayClient.ChannelRecipientRemove += (data) =>
{
    // data.ChannelId - Group DM channel
    // data.User - User who was removed
};</code></pre>

        <h2 id="guilds">Guild Events</h2>

        <h3>GuildCreate</h3>
        <p>Fires when the bot joins a guild or when a guild becomes available after an outage.</p>
        <pre><code class="language-cs">gatewayClient.GuildCreate += (data) =>
{
    // data.Guild - Full guild data including channels, roles, members
};</code></pre>

        <h3>GuildUpdate</h3>
        <p>Fires when a guild is updated (name, icon, settings, etc.).</p>
        <pre><code class="language-cs">gatewayClient.GuildUpdate += (data) =>
{
    // data.Guild - Updated guild data
};</code></pre>

        <h3>GuildDelete</h3>
        <p>Fires when the bot is removed from a guild or the guild becomes unavailable.</p>
        <pre><code class="language-cs">gatewayClient.GuildDelete += (data) =>
{
    // data.Id - Guild ID that was deleted/left
};</code></pre>

        <h3>GuildBanAdd / GuildBanRemove</h3>
        <p>Fires when a user is banned or unbanned from a guild.</p>
        <pre><code class="language-cs">gatewayClient.GuildBanAdd += (data) =>
{
    // data.GuildId - Guild where ban occurred
    // data.User - User who was banned
};

gatewayClient.GuildBanRemove += (data) =>
{
    // data.GuildId - Guild where unban occurred
    // data.User - User who was unbanned
};</code></pre>

        <h3>GuildEmojisUpdate</h3>
        <p>Fires when the list of emojis in a guild is updated.</p>
        <pre><code class="language-cs">gatewayClient.GuildEmojisUpdate += (data) =>
{
    // data.GuildId - Guild where emojis changed
    // data.Emojis - Updated list of emojis
};</code></pre>

        <h3>GuildStickersUpdate</h3>
        <p>Fires when the list of stickers in a guild is updated.</p>
        <pre><code class="language-cs">gatewayClient.GuildStickersUpdate += (data) =>
{
    // data.GuildId - Guild where stickers changed
    // data.Stickers - Updated list of stickers
};</code></pre>

        <h2 id="members">Guild Member Events</h2>

        <h3>GuildMemberAdd</h3>
        <p>Fires when a new member joins a guild.</p>
        <pre><code class="language-cs">gatewayClient.GuildMemberAdd += (data) =>
{
    // data.GuildId - Guild the member joined
    // data.Member - Member data including user and roles
};</code></pre>

        <h3>GuildMemberUpdate</h3>
        <p>Fires when a member is updated (nickname, roles, avatar, etc.).</p>
        <pre><code class="language-cs">gatewayClient.GuildMemberUpdate += (data) =>
{
    // data.GuildId - Guild where member was updated
    // data.Member - Updated member data
};</code></pre>

        <h3>GuildMemberRemove</h3>
        <p>Fires when a member leaves a guild or is kicked/banned.</p>
        <pre><code class="language-cs">gatewayClient.GuildMemberRemove += (data) =>
{
    // data.GuildId - Guild the member left
    // data.UserId - User who left
};</code></pre>

        <h2 id="roles">Guild Role Events</h2>

        <h3>GuildRoleCreate</h3>
        <p>Fires when a new role is created in a guild.</p>
        <pre><code class="language-cs">gatewayClient.GuildRoleCreate += (data) =>
{
    // data.GuildId - Guild where role was created
    // data.Role - The created role
};</code></pre>

        <h3>GuildRoleUpdate</h3>
        <p>Fires when a role is updated.</p>
        <pre><code class="language-cs">gatewayClient.GuildRoleUpdate += (data) =>
{
    // data.GuildId - Guild where role was updated
    // data.Role - Updated role data
};</code></pre>

        <h3>GuildRoleDelete</h3>
        <p>Fires when a role is deleted.</p>
        <pre><code class="language-cs">gatewayClient.GuildRoleDelete += (data) =>
{
    // data.GuildId - Guild where role was deleted
    // data.RoleId - ID of the deleted role
};</code></pre>

        <h2 id="presence">Presence Events</h2>

        <h3>PresenceUpdate</h3>
        <p>Fires when a user's presence (online status) changes.</p>
        <pre><code class="language-cs">gatewayClient.PresenceUpdate += (data) =>
{
    // data.User - User whose presence changed
    // data.Status - New status (Online, Idle, DoNotDisturb, Invisible)
    // data.ClientStatus - Status per client (web, mobile, desktop)
};</code></pre>

        <p><strong>Note:</strong> This can be a high-volume event. Consider filtering it out if you don't need it:</p>
        <pre><code class="language-cs">var config = new FluxerConfig
{
    IgnoredGatewayEvents = new List<string> { "PRESENCE_UPDATE" }
};</code></pre>

        <h2 id="typing">Typing Events</h2>

        <h3>TypingStart</h3>
        <p>Fires when a user starts typing in a channel.</p>
        <pre><code class="language-cs">gatewayClient.TypingStart += (data) =>
{
    // data.ChannelId - Channel where typing started
    // data.UserId - User who started typing
    // data.Timestamp - When typing started
};</code></pre>

        <h3>TypingStop</h3>
        <p>Fires when a user stops typing.</p>
        <pre><code class="language-cs">gatewayClient.TypingStop += (data) =>
{
    // data.ChannelId - Channel where typing stopped
    // data.UserId - User who stopped typing
};</code></pre>

        <h2 id="reactions">Reaction Events</h2>

        <h3>MessageReactionAdd</h3>
        <p>Fires when a user adds a reaction to a message.</p>
        <pre><code class="language-cs">gatewayClient.MessageReactionAdd += (data) =>
{
    // data.UserId - User who added the reaction
    // data.ChannelId - Channel containing the message
    // data.MessageId - Message that was reacted to
    // data.Emoji - The emoji that was used
};</code></pre>

        <h3>MessageReactionRemove</h3>
        <p>Fires when a user removes a reaction from a message.</p>
        <pre><code class="language-cs">gatewayClient.MessageReactionRemove += (data) =>
{
    // data.UserId - User who removed the reaction
    // data.ChannelId - Channel containing the message
    // data.MessageId - Message the reaction was removed from
    // data.Emoji - The emoji that was removed
};</code></pre>

        <h3>MessageReactionRemoveAll</h3>
        <p>Fires when all reactions are removed from a message.</p>
        <pre><code class="language-cs">gatewayClient.MessageReactionRemoveAll += (data) =>
{
    // data.ChannelId - Channel containing the message
    // data.MessageId - Message that had all reactions cleared
};</code></pre>

        <h3>MessageReactionRemoveEmoji</h3>
        <p>Fires when all instances of a specific emoji are removed from a message.</p>
        <pre><code class="language-cs">gatewayClient.MessageReactionRemoveEmoji += (data) =>
{
    // data.ChannelId - Channel containing the message
    // data.MessageId - Message that had emoji removed
    // data.Emoji - The emoji that was removed
};</code></pre>

        <h2 id="voice">Voice Events</h2>

        <p style="background-color: #FEE75C; color: #2C2C2C; padding: 10px; border-radius: 4px; border-left: 4px solid #F0C419;">
            <strong>⚠️ Note:</strong> Voice functionality in Fluxer.Net is in very early alpha. See the <a href="/guides/voice-client.html" style="color: #2C2C2C; text-decoration: underline;">Voice Client Guide</a> for current limitations.
        </p>

        <h3>VoiceStateUpdate</h3>
        <p>Fires when a user joins, leaves, or updates their state in a voice channel.</p>
        <pre><code class="language-cs">gatewayClient.VoiceStateUpdate += (data) =>
{
    // data.GuildId - Guild where voice state changed
    // data.ChannelId - Voice channel (null if user left)
    // data.UserId - User whose voice state changed
    // data.SessionId - Voice session ID
    // data.Deaf - Whether user is deafened
    // data.Mute - Whether user is muted
    // data.SelfDeaf - Whether user self-deafened
    // data.SelfMute - Whether user self-muted
};</code></pre>

        <h3>VoiceServerUpdate</h3>
        <p>Fires when voice server information is updated (used for establishing voice connections).</p>
        <pre><code class="language-cs">gatewayClient.VoiceServerUpdate += (data) =>
{
    // data.Token - Voice authentication token (LiveKit JWT)
    // data.GuildId - Guild ID
    // data.Endpoint - Voice server endpoint (LiveKit server)

    // These events are needed to establish a voice connection
    // See /guides/voice-client.html for usage
};</code></pre>

        <h2 id="relationships">Relationship Events</h2>

        <h3>RelationshipAdd</h3>
        <p>Fires when a relationship (friend, pending friend request, block) is added.</p>
        <pre><code class="language-cs">gatewayClient.RelationshipAdd += (data) =>
{
    // data.Id - User ID
    // data.Type - Relationship type (friend, blocked, etc.)
    // data.User - User information
};</code></pre>

        <h3>RelationshipUpdate</h3>
        <p>Fires when a relationship is updated (e.g., friend request accepted).</p>
        <pre><code class="language-cs">gatewayClient.RelationshipUpdate += (data) =>
{
    // data.Id - User ID
    // data.Type - Updated relationship type
};</code></pre>

        <h3>RelationshipRemove</h3>
        <p>Fires when a relationship is removed (unfriend, unblock).</p>
        <pre><code class="language-cs">gatewayClient.RelationshipRemove += (data) =>
{
    // data.Id - User ID
    // data.Type - Previous relationship type
};</code></pre>

        <h2 id="invites">Invite Events</h2>

        <h3>InviteCreate</h3>
        <p>Fires when a new invite is created.</p>
        <pre><code class="language-cs">gatewayClient.InviteCreate += (data) =>
{
    // data.Code - Invite code
    // data.GuildId - Guild the invite is for
    // data.ChannelId - Channel the invite was created in
    // data.Inviter - User who created the invite
};</code></pre>

        <h3>InviteDelete</h3>
        <p>Fires when an invite is deleted or expires.</p>
        <pre><code class="language-cs">gatewayClient.InviteDelete += (data) =>
{
    // data.Code - Deleted invite code
    // data.GuildId - Guild the invite was for
    // data.ChannelId - Channel the invite was in
};</code></pre>

        <h2 id="user-settings">User Settings Events</h2>

        <h3>UserUpdate</h3>
        <p>Fires when the current user's account is updated.</p>
        <pre><code class="language-cs">gatewayClient.UserUpdate += (data) =>
{
    // data.User - Updated user data
};</code></pre>

        <h3>UserSettingsUpdate</h3>
        <p>Fires when user settings are updated.</p>
        <pre><code class="language-cs">gatewayClient.UserSettingsUpdate += (data) =>
{
    // data.Settings - Updated settings
};</code></pre>

        <h3>UserGuildSettingsUpdate</h3>
        <p>Fires when user guild-specific settings are updated.</p>
        <pre><code class="language-cs">gatewayClient.UserGuildSettingsUpdate += (data) =>
{
    // data.GuildId - Guild where settings changed
    // data.Settings - Updated guild settings
};</code></pre>

        <h2>Filtering Events</h2>

        <p>To reduce bandwidth and improve performance, you can filter out events you don't need:</p>

        <pre><code class="language-cs">var config = new FluxerConfig
{
    IgnoredGatewayEvents = new List<string>
    {
        "PRESENCE_UPDATE",      // High-volume event
        "TYPING_START",
        "TYPING_STOP",
        "MESSAGE_REACTION_ADD", // If you don't care about reactions
        "VOICE_STATE_UPDATE"    // If you don't use voice
    }
};</code></pre>
