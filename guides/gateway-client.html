        <h1>Gateway Client Reference</h1>

        <p>The <code>GatewayClient</code> provides real-time event streaming through a WebSocket connection to the Fluxer gateway. It handles bidirectional communication, automatic heartbeats, and reconnection with resume capability.</p>

        <h2>Overview</h2>

        <p>The Gateway Client is responsible for:</p>
        <ul>
            <li>Maintaining a persistent WebSocket connection to Fluxer</li>
            <li>Sending automatic heartbeats to keep the connection alive</li>
            <li>Receiving real-time events (messages, user updates, guild changes, etc.)</li>
            <li>Automatic reconnection with session resuming (no event loss)</li>
            <li>Handling Fluxer gateway opcodes and close codes</li>
        </ul>

        <h2>Initialization</h2>

        <pre><code class="language-cs">using Fluxer.Net;

const string token = "YOUR_TOKEN_HERE";

var config = new FluxerConfig
{
    // Optional configuration
    ReconnectAttemptDelay = 10,
    EnableRateLimiting = true
};

var gatewayClient = new GatewayClient(token, config);</code></pre>

        <h2>Connection</h2>

        <h3>ConnectAsync()</h3>
        <p>Establishes a WebSocket connection to the Fluxer gateway and sends the IDENTIFY packet.</p>

        <pre><code class="language-cs">await gatewayClient.ConnectAsync();</code></pre>

        <p>This method:</p>
        <ol>
            <li>Creates a WebSocket connection to the gateway URL</li>
            <li>Sets up message and reconnection handlers</li>
            <li>Sends an IDENTIFY packet with authentication token and presence</li>
            <li>Waits for HELLO event to begin heartbeat mechanism</li>
        </ol>

        <h2>Gateway Lifecycle Events</h2>

        <h3>Ready Event</h3>
        <p>Fires when the gateway connection is established and initial data is received. Contains session ID, user info, and initial guilds/channels/DMs.</p>

        <pre><code class="language-cs">gatewayClient.Ready += (data) =>
{
    Console.WriteLine($"Bot ready! Logged in as {data.User.Username}");
    Console.WriteLine($"Session ID: {data.SessionId}");
    Console.WriteLine($"Connected to {data.Guilds.Count} guilds");

    // Access initial data
    foreach (var guild in data.Guilds)
    {
        Console.WriteLine($"Guild: {guild.Name} ({guild.Id})");
    }

    // Access user data
    Console.WriteLine($"User ID: {data.User.Id}");
    Console.WriteLine($"Email: {data.User.Email}");
};</code></pre>

        <h3>Resumed Event</h3>
        <p>Fires when a disconnected session is successfully resumed without data loss.</p>

        <pre><code class="language-cs">gatewayClient.Resumed += () =>
{
    Console.WriteLine("Gateway connection resumed successfully!");
};</code></pre>

        <h3>HeartbeatAck Event</h3>
        <p>Fires when the gateway acknowledges a heartbeat packet (used for connection monitoring).</p>

        <pre><code class="language-cs">gatewayClient.HeartbeatAck += () =>
{
    Console.WriteLine("Heartbeat acknowledged");
};</code></pre>

        <h2>Message Events</h2>

        <h3>MessageCreate</h3>
        <p>Fires when a new message is created in any channel the user has access to.</p>

        <pre><code class="language-cs">gatewayClient.MessageCreate += async (data) =>
{
    var message = data.Message;
    Console.WriteLine($"[{message.ChannelId}] {message.Author.Username}: {message.Content}");

    // Check for attachments
    if (message.Attachments?.Count > 0)
    {
        Console.WriteLine($"  {message.Attachments.Count} attachment(s)");
    }

    // Check for embeds
    if (message.Embeds?.Count > 0)
    {
        Console.WriteLine($"  {message.Embeds.Count} embed(s)");
    }

    // Check for mentions
    if (message.Mentions?.Count > 0)
    {
        Console.WriteLine($"  Mentions: {string.Join(", ", message.Mentions.Select(u => u.Username))}");
    }
};</code></pre>

        <h3>MessageUpdate</h3>
        <p>Fires when a message is edited.</p>

        <pre><code class="language-cs">gatewayClient.MessageUpdate += (data) =>
{
    Console.WriteLine($"Message {data.Message.Id} was edited");
    Console.WriteLine($"New content: {data.Message.Content}");
};</code></pre>

        <h3>MessageDelete</h3>
        <p>Fires when a message is deleted.</p>

        <pre><code class="language-cs">gatewayClient.MessageDelete += (data) =>
{
    Console.WriteLine($"Message {data.Id} was deleted from channel {data.ChannelId}");
};</code></pre>

        <h2>Channel Events</h2>

        <pre><code class="language-cs">// Channel created
gatewayClient.ChannelCreate += (data) =>
{
    Console.WriteLine($"Channel created: {data.Channel.Name} ({data.Channel.Id})");
};

// Channel updated
gatewayClient.ChannelUpdate += (data) =>
{
    Console.WriteLine($"Channel updated: {data.Channel.Name}");
};

// Channel deleted
gatewayClient.ChannelDelete += (data) =>
{
    Console.WriteLine($"Channel deleted: {data.Channel.Name}");
};</code></pre>

        <h2>Guild Events</h2>

        <pre><code class="language-cs">// Guild created/became available
gatewayClient.GuildCreate += (data) =>
{
    var guild = data.Guild;
    Console.WriteLine($"Guild: {guild.Name} ({guild.MemberCount} members)");
};

// Guild updated
gatewayClient.GuildUpdate += (data) =>
{
    Console.WriteLine($"Guild updated: {data.Guild.Name}");
};

// Guild deleted/became unavailable
gatewayClient.GuildDelete += (data) =>
{
    Console.WriteLine($"Guild {data.Id} is no longer available");
};</code></pre>

        <h2>Guild Member Events</h2>

        <pre><code class="language-cs">// Member joined
gatewayClient.GuildMemberAdd += (data) =>
{
    Console.WriteLine($"{data.Member.User.Username} joined guild {data.GuildId}");
};

// Member updated
gatewayClient.GuildMemberUpdate += (data) =>
{
    Console.WriteLine($"Member {data.Member.User.Username} updated");
};

// Member left/removed
gatewayClient.GuildMemberRemove += (data) =>
{
    Console.WriteLine($"Member {data.UserId} left guild {data.GuildId}");
};</code></pre>

        <h2>Presence Events</h2>

        <pre><code class="language-cs">gatewayClient.PresenceUpdate += (data) =>
{
    Console.WriteLine($"{data.User.Username} is now {data.Status}");
    Console.WriteLine($"  Client Status: {data.ClientStatus}");
};</code></pre>

        <h2>Typing Events</h2>

        <pre><code class="language-cs">gatewayClient.TypingStart += (data) =>
{
    Console.WriteLine($"{data.UserId} started typing in {data.ChannelId}");
};

gatewayClient.TypingStop += (data) =>
{
    Console.WriteLine($"{data.UserId} stopped typing");
};</code></pre>

        <h2>Reaction Events</h2>

        <pre><code class="language-cs">gatewayClient.MessageReactionAdd += (data) =>
{
    Console.WriteLine($"Reaction added: {data.Emoji.Name} by {data.UserId}");
};

gatewayClient.MessageReactionRemove += (data) =>
{
    Console.WriteLine($"Reaction removed: {data.Emoji.Name}");
};</code></pre>

        <h2>Sending Gateway Packets</h2>

        <h3>SetStatus(Status)</h3>
        <p>Updates the current user's presence status on the gateway.</p>

        <pre><code class="language-cs">using Fluxer.Net.Data.Enums;

// Set status to Do Not Disturb
gatewayClient.SetStatus(Status.DoNotDisturb);

// Other statuses
gatewayClient.SetStatus(Status.Online);
gatewayClient.SetStatus(Status.Idle);
gatewayClient.SetStatus(Status.Invisible);</code></pre>

        <h3>SendGatewayPacket&lt;T&gt;(T Data)</h3>
        <p>Sends a custom gateway packet to the Fluxer WebSocket server. Advanced users only.</p>

        <pre><code class="language-cs">var customPacket = new GatewayPacket
{
    OpCode = FluxerOpCode.PresenceUpdate,
    Data = new PresenceUpdateGatewayData(Status.Online)
};

gatewayClient.SendGatewayPacket(customPacket);</code></pre>

        <h2>Connection Management</h2>

        <h3>Automatic Reconnection</h3>
        <p>The Gateway Client automatically reconnects when the connection is lost and attempts to resume the session to prevent event loss.</p>

        <h3>Session Resuming</h3>
        <p>When reconnecting, the client sends a RESUME packet with:</p>
        <ul>
            <li><strong>Session ID:</strong> Received from the READY event</li>
            <li><strong>Sequence Number:</strong> The last event sequence number received</li>
            <li><strong>Token:</strong> Your authentication token</li>
        </ul>

        <p>If the session can be resumed, you'll receive a RESUMED event. Otherwise, a new READY event is sent.</p>

        <h3>Gateway Close Codes</h3>
        <p>The Gateway Client handles Fluxer-specific close codes appropriately:</p>

        <table>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Reconnect?</th>
            </tr>
            <tr>
                <td>4000</td>
                <td>Unknown Error</td>
                <td>Yes</td>
            </tr>
            <tr>
                <td>4001</td>
                <td>Unknown Opcode</td>
                <td>Yes (client bug)</td>
            </tr>
            <tr>
                <td>4002</td>
                <td>Decode Error</td>
                <td>Yes (client bug)</td>
            </tr>
            <tr>
                <td>4003</td>
                <td>Not Authenticated</td>
                <td>Yes</td>
            </tr>
            <tr>
                <td>4004</td>
                <td>Authentication Failed</td>
                <td><strong>No</strong> (invalid token)</td>
            </tr>
            <tr>
                <td>4005</td>
                <td>Already Authenticated</td>
                <td>Yes</td>
            </tr>
            <tr>
                <td>4007</td>
                <td>Invalid Sequence</td>
                <td>Yes (create new session)</td>
            </tr>
            <tr>
                <td>4008</td>
                <td>Rate Limited</td>
                <td>Yes (with delay)</td>
            </tr>
            <tr>
                <td>4009</td>
                <td>Session Timeout</td>
                <td>Yes (create new session)</td>
            </tr>
        </table>

        <h2>Disposal</h2>

        <p>The <code>GatewayClient</code> implements <code>IDisposable</code> and should be properly disposed:</p>

        <pre><code class="language-cs">using var gatewayClient = new GatewayClient(token, config);
await gatewayClient.ConnectAsync();

// Client is automatically disposed when exiting the using block</code></pre>

        <p>Or manually:</p>

        <pre><code class="language-cs">gatewayClient.Dispose();</code></pre>

        <h2>Best Practices</h2>

        <h3>1. Wait for Ready Event</h3>
        <pre><code class="language-cs">var readyReceived = new TaskCompletionSource<bool>();

gatewayClient.Ready += (data) =>
{
    readyReceived.SetResult(true);
};

await gatewayClient.ConnectAsync();
await readyReceived.Task; // Wait for Ready before proceeding</code></pre>

        <h3>2. Filter Unnecessary Events</h3>
        <pre><code class="language-cs">var config = new FluxerConfig
{
    IgnoredGatewayEvents = new List<string>
    {
        "PRESENCE_UPDATE",
        "TYPING_START",
        "TYPING_STOP"
    }
};</code></pre>

        <h3>3. Handle Exceptions in Event Handlers</h3>
        <pre><code class="language-cs">gatewayClient.MessageCreate += async (data) =>
{
    try
    {
        // Your message handling code
    }
    catch (Exception ex)
    {
        Log.Error(ex, "Error handling message");
    }
};</code></pre>
