        <h1>Voice Client</h1>

        <div style="background-color: #ED4245; color: white; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 6px solid #a32d2f;">
            <h2 style="margin-top: 0; color: white;">⚠️ ALPHA WARNING - EXPERIMENTAL FEATURE</h2>
            <p style="margin-bottom: 0;"><strong>Voice support is in very early alpha testing and is NOT fully functional yet.</strong></p>
            <ul style="margin-bottom: 0;">
                <li>This implementation uses LiveKit (Fluxer BETA API protocol)</li>
                <li>Audio streaming requires WebRTC implementation which is <strong>not yet complete</strong></li>
                <li>The VoiceClient can connect but <strong>cannot send or receive audio</strong> at this time</li>
                <li>This API is subject to breaking changes without notice</li>
                <li>Do not use in production environments</li>
            </ul>
            <p style="margin-bottom: 0; margin-top: 15px;"><strong>Status:</strong> Connection and signaling work, but audio transmission requires additional WebRTC implementation using libraries like SIPSorcery.</p>
        </div>

        <p>The <code>VoiceClient</code> provides experimental support for connecting to Fluxer voice channels using LiveKit protocol. While basic connection is implemented, full audio streaming capabilities are not yet available.</p>

        <h2>What Currently Works</h2>
        <ul>
            <li>Connecting to LiveKit voice servers</li>
            <li>WebSocket signaling with the LiveKit server</li>
            <li>Joining voice rooms</li>
            <li>Receiving connection events</li>
        </ul>

        <h2>What Doesn't Work Yet</h2>
        <ul>
            <li>❌ Sending audio data</li>
            <li>❌ Receiving audio from other users</li>
            <li>❌ WebRTC peer connection establishment</li>
            <li>❌ DTLS/SRTP encryption for audio streams</li>
            <li>❌ RTP packet transmission</li>
        </ul>

        <h2>Prerequisites</h2>

        <p>Voice functionality requires additional NuGet packages (not included by default):</p>

        <pre><code class="language-sh">dotnet add package NAudio
dotnet add package Concentus  # For Opus encoding</code></pre>

        <h2>Basic Connection (Experimental)</h2>

        <h3>1. Listen for Voice Events</h3>
        <p>To connect to voice, you need to listen for the <code>VOICE_STATE_UPDATE</code> and <code>VOICE_SERVER_UPDATE</code> gateway events:</p>

        <pre><code class="language-cs">using Fluxer.Net;
using Fluxer.Net.Voice;
using Fluxer.Net.Gateway.Data;
using Serilog;

string? sessionId = null;
string? voiceToken = null;
string? endpoint = null;
ulong targetGuildId = YOUR_GUILD_ID;
ulong targetChannelId = YOUR_VOICE_CHANNEL_ID;

// Listen for voice state updates
gatewayClient.VoiceStateUpdate += (data) =>
{
    if (data.UserId == YOUR_BOT_USER_ID && data.GuildId == targetGuildId)
    {
        sessionId = data.SessionId;
        Log.Information("Voice state updated, session: {SessionId}", sessionId);
    }
};

// Listen for voice server updates
gatewayClient.VoiceServerUpdate += (data) =>
{
    if (data.GuildId == targetGuildId)
    {
        voiceToken = data.Token;
        endpoint = data.Endpoint;
        Log.Information("Voice server update: {Endpoint}", endpoint);

        // We now have all required info to connect
        if (sessionId != null && voiceToken != null && endpoint != null)
        {
            Task.Run(async () => await ConnectToVoice(
                endpoint, targetGuildId, YOUR_BOT_USER_ID, sessionId, voiceToken));
        }
    }
};</code></pre>

        <h3>2. Request to Join Voice Channel</h3>
        <p>Use the ApiClient to update your voice state and join a voice channel:</p>

        <pre><code class="language-cs">// Join a voice channel
await apiClient.UpdateVoiceState(targetGuildId, new()
{
    ChannelId = targetChannelId,
    SelfMute = false,
    SelfDeaf = false
});</code></pre>

        <h3>3. Connect to Voice Server (Experimental)</h3>

        <pre><code class="language-cs">async Task ConnectToVoice(string endpoint, ulong guildId, ulong userId,
                          string sessionId, string token)
{
    try
    {
        var voiceClient = new VoiceClient(
            endpoint: endpoint,
            guildId: guildId,
            userId: userId,
            sessionId: sessionId,
            token: token,
            logger: Log.Logger
        );

        voiceClient.OnReady += () =>
        {
            Log.Information("Voice client connected and ready!");
            // Note: You can't actually send audio yet
        };

        voiceClient.OnError += (ex) =>
        {
            Log.Error(ex, "Voice client error");
        };

        await voiceClient.ConnectAsync();

        Log.Information("Voice client connected to LiveKit server");

        // Keep the voice connection alive
        await Task.Delay(-1);
    }
    catch (Exception ex)
    {
        Log.Error(ex, "Failed to connect to voice");
    }
}</code></pre>

        <pre><code class="language-cs">// This code exists but DOES NOT WORK yet
var audioPlayer = new AudioPlayer(voiceClient, Log.Logger);

audioPlayer.OnPlaybackFinished += () =>
{

        <h2>Disconnecting from Voice</h2>

        <pre><code class="language-cs">// Disconnect from voice channel
await voiceClient.DisconnectAsync();

// Or leave via API
await apiClient.UpdateVoiceState(guildId, new()
{
    ChannelId = null  // null = leave voice
});</code></pre>

        <h2>Complete Example (Experimental)</h2>

        <pre><code class="language-cs">using Fluxer.Net;
using Fluxer.Net.Voice;
using Fluxer.Net.Gateway.Data;
using Serilog;

Log.Logger = new LoggerConfiguration()
    .MinimumLevel.Information()
    .WriteTo.Console()
    .CreateLogger();

const string token = "YOUR_TOKEN_HERE";
const ulong guildId = YOUR_GUILD_ID;
const ulong channelId = YOUR_VOICE_CHANNEL_ID;
ulong botUserId = 0;

var config = new FluxerConfig { Serilog = Log.Logger };
var api = new ApiClient(token, config);
var gateway = new GatewayClient(token, config);

string? sessionId = null;
string? voiceToken = null;
string? endpoint = null;
VoiceClient? voiceClient = null;

gateway.Ready += (data) =>
{
    botUserId = data.User.Id;
    Log.Information("Bot ready! User ID: {UserId}", botUserId);
};

gateway.VoiceStateUpdate += (data) =>
{
    if (data.UserId == botUserId && data.GuildId == guildId)
    {
        sessionId = data.SessionId;
        Log.Information("Got session ID: {SessionId}", sessionId);
        TryConnectVoice();
    }
};

gateway.VoiceServerUpdate += (data) =>
{
    if (data.GuildId == guildId)
    {
        voiceToken = data.Token;
        endpoint = data.Endpoint;
        Log.Information("Got voice server: {Endpoint}", endpoint);
        TryConnectVoice();
    }
};

void TryConnectVoice()
{
    if (sessionId != null && voiceToken != null && endpoint != null && botUserId != 0)
    {
        Task.Run(async () =>
        {
            voiceClient = new VoiceClient(endpoint, guildId, botUserId,
                                         sessionId, voiceToken, Log.Logger);

            voiceClient.OnReady += () =>
            {
                Log.Information("Voice connection established!");
            };

            voiceClient.OnError += (ex) =>
            {
                Log.Error(ex, "Voice error");
            };

            await voiceClient.ConnectAsync();
        });
    }
}

await gateway.ConnectAsync();
Log.Information("Connected to gateway");

// Wait a bit for READY event
await Task.Delay(3000);

// Request to join voice channel
Log.Information("Requesting to join voice channel...");
await api.UpdateVoiceState(guildId, new()
{
    ChannelId = channelId,
    SelfMute = false,
    SelfDeaf = false
});

await Task.Delay(-1);</code></pre>

        <h2>Technical Implementation Notes</h2>

        <h3>LiveKit Protocol</h3>
        <p>Fluxer BETA uses LiveKit for voice connections. LiveKit is a WebRTC-based platform that requires:</p>
        <ul>
            <li>WebSocket signaling (implemented)</li>
            <li>WebRTC peer connections (not implemented)</li>
            <li>DTLS for encryption (not implemented)</li>
            <li>RTP for audio streaming (not implemented)</li>
        </ul>

        <h3>What's Missing</h3>
        <p>To complete voice support, the following would need to be implemented:</p>
        <pre><code class="language-cs">// 1. WebRTC peer connection using SIPSorcery or similar
// 2. DTLS handshake for encryption
// 3. SRTP encryption for audio packets
// 4. RTP packet construction and transmission
// 5. Opus encoding/decoding (partial - encoder exists)
// 6. Audio receiving and decoding</code></pre>

        <h3>Potential Libraries for Full Implementation</h3>
        <ul>
            <li><strong>SIPSorcery:</strong> Provides WebRTC, DTLS, and SRTP support</li>
            <li><strong>WebRTC.NET:</strong> Alternative WebRTC implementation</li>
            <li><strong>Concentus:</strong> Pure C# Opus codec (already used for encoding)</li>
            <li><strong>NAudio:</strong> Audio processing library (already used)</li>
        </ul>

        <h2>Future Development</h2>

        <p>Voice support is planned for future releases but requires significant WebRTC infrastructure work. Contributions are welcome! If you're interested in implementing full voice support, please check the GitHub repository.</p>

        <p><strong>Estimated complexity:</strong> High - Requires deep understanding of WebRTC, encryption protocols, and real-time audio streaming.</p>
