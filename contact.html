<!DOCTYPE html>
<head>
    <title>Squll.Net Tutorial</title>
    <meta charset="utf-8" />
    <link rel="preload" as="style" href="/assets/defaults.css" />
    <link rel="stylesheet" href="/assets/defaults.css" />
    <link rel="icon" href="/assets/imgs/nexfinity.png" />
</head>

<body>
    <template id="select">contact-header</template>
    <template id="content">
        <div class="widget" id="widget-nexfinity">
            <div class="widget-name">
                <img src="/assets/imgs/nexfinity.png" width="42" />
                <span>Nexfinity Squad</span>
            </div>
            <p class="widget-description">Want the fastest help? Join our Squad on Squll and ask the community for assistance!</p>
            <div class="widget-footer">
                <span class="server-widget-online" id="squad-online">5 members</span>
                <a class="join-action" href="https://squll.com/invite/squll.net">Join Now!</a>
            </div>
        </div>
		
		<div class="widget" id="widget-nexfinity">
            <div class="widget-name">
                <img src="/assets/imgs/nexfinity.png" width="42" />
                <span>Nexfinity Repository</span>
            </div>
            <p class="widget-description">Found an issue with the library? Want to suggest a new or missing feature? Create an issue oon our GitHub repository.</p>
            <div class="widget-footer">
                <!--<span class="server-widget-online" id="squad-online">5 members</span>-->
                <a class="join-action" href="https://github.com/Nexfinity/Squll.Net">Open GitHub</a>
            </div>
        </div>

        <div class="widget" id="widget-cat">
            <div class="widget-name">
                <img
                    src="//theowlshed.cottagedwelling.dev/f9e1dfc9a3a8db57fdd872631a493512.png"
                    width="42" />
                <span>CottageDwellingCat</span>
            </div>
            <p class="widget-description">Hi, I'm Grave, I wrote most of the
                content on this site and can fix any typos or program errors you
                notice. I don't provide one-on-one support and suggest you go to
                the Squad if you need help.</p>
            <div class="widget-footer">
                <span class="server-widget-online">Very slow responses!</span>
                <a class="join-action" href="mailto:cat@cottagedwelling.dev">Email Me</a>
            </div>
        </div>
    </template>
    <script src="/assets/scripts/loader.js"></script>
</body>
