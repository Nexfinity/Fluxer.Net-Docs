<!DOCTYPE html>
<head>
    <title>Discord.Net Tutorial</title>
    <meta charset="utf-8" />
    <link rel="preload" as="style" href="/assets/defaults.css" />
    <link rel="stylesheet" href="/assets/defaults.css" />
    <link rel="icon" href="/assets/imgs/nextinfinity.png" />
</head>

<body>
    <template id="select">about-header</template>
    <template id="content">
        <div id="output">

        </div>
    </template>
    <script src="/assets/scripts/loader.js"></script>

    <script src="/assets/ext/shikijs/dist/index.unpkg.iife.js"></script>
    <script>
        shiki.setCDN("/assets/ext/shikijs");
        var highlighter;
        
        shiki.loadTheme('themes/dracula.json').then(theme => shiki.getHighlighter({theme: theme, langs: ['cs', 'sh']}).then(hl => resolveCode(hl)));
            
        function resolveCode(hl)
        {
            var code = hl.codeToHtml(`public static void Main()
{
    Console.Write("uwu");
}`, { lang: 'cs' });
            document.getElementById('output').innerHTML = code
        }
    </script>
</body>
